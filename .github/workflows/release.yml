name: Release

# Tag a commit `v0.3.0` and push it. The tag must match wmkb.versionName in
# gradle.properties or the first job stops the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but do not publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      buildable: ${{ steps.v.outputs.buildable }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          declared=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          # Tags older than this pipeline keep the version in
          # app/build.gradle.kts and cannot be built by it. They were tagged
          # after the fact so their notes have somewhere to live, so stand the
          # run down rather than failing it; their releases are made by hand.
          if [ -z "$declared" ]; then
            echo "::notice::${{ github.ref_name }} has no wmkb.versionName and predates this workflow. Nothing to build."
            {
              echo "version="
              echo "buildable=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "buildable=true" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            tag='${{ github.ref_name }}'
            if [ "v$declared" != "$tag" ]; then
              echo "::error::Tag $tag does not match wmkb.versionName=$declared"
              exit 1
            fi
          fi
          echo "Releasing $declared"

      # F-Droid and Play read the release notes by the manifest's versionCode,
      # which has an ABI digit from 0.6.2, and F-Droid reads them from the
      # tagged commit, so the copies have to be in it already.
      - name: Check the changelog copies
        if: steps.v.outputs.buildable == 'true'
        run: scripts/changelog-abi-copies.sh --check

  apks:
    name: Signed APKs (direct download)
    needs: verify
    if: needs.verify.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # The signing block resolves RELEASE_STORE_FILE against the repo root, so
      # the keystore is written there and never leaves the runner.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Release builds must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # assets/supporters.json is what the app lists before its own network
      # check, and all a no-internet build ever shows. Refresh it from the live
      # /api/supporters so each release names everyone who tipped up to the
      # build, not up to the last time someone ran `npm run supporters`. Site
      # down: keep the committed copy, never fail a release over a credits list.
      # F-Droid builds from the tagged source, so its APK has the committed one.
      - name: Refresh the supporters list
        run: node docs/scripts/sync-supporters.mjs || echo "::warning::Could not reach /api/supporters; this build ships the committed supporters.json"

      # splitApks=true gives one APK per ABI instead of one fat universal APK,
      # which is what the download page wants. Play channel off: this build must
      # not carry the in-app-update library, since it only works via Play.
      - name: Build release APKs
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'false'
          WMKB_ENABLE_GMS: 'true'
          WMKB_SPLIT_APKS: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
          WMKB_ONEDRIVE_CLIENT_ID: ${{ secrets.WMKB_ONEDRIVE_CLIENT_ID }}
          WMKB_SMARTTHINGS_CLIENT_ID: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_ID }}
          WMKB_SMARTTHINGS_CLIENT_SECRET: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_SECRET }}
        # One variant per Gradle call. All four at once shared one Kotlin
        # daemon and ran it out of heap at 4 GB (0.5.13, two compiles side by
        # side), after 0.5.8 had already
        # needed the 4 GB. In turn, each compile and R8 pass has the daemons to
        # itself; the daemons stay warm between calls, and the modules below
        # :app are built once.
        #
        # Two builds from 0.6.3. GitHub publishes one standard build, in
        # English, which fetches its feature libraries (native delivery) and its
        # other interface languages (language packs) on demand, and the offline
        # build below. The all-languages build is made here only to cut the
        # language packs from: compiled with the English build's resource IDs,
        # so each pack's strings have the IDs the English APK asks for.
        run: |
          # The English build's resource IDs: the stableIds.txt AGP writes for
          # every resource link (app/build.gradle.kts, androidResources).
          ids="$PWD/build/resource-ids.txt"
          mkdir -p build
          ./gradlew assembleEnRelease \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace
          cp app/build/intermediates/stable_resource_ids_file/enRelease/processEnReleaseResources/stableIds.txt "$ids"
          ./gradlew assembleIntlRelease "-Pwmkb.stableResourceIds=$ids" \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace

      # Versioned filenames (wmkeyboard-0.6.3-vc370-full-en-arm64-v8a.apk) so
      # APKs from different releases can sit in the same Downloads folder
      # without the browser calling them duplicates. vc = versionCode, which
      # moves even when the name does not (a re-cut of the same versionName).
      #
      # `full` is the edition token from when there were two (full, lite). The
      # app has no such flavour since 0.6.3, but every install already out
      # there only parses names that carry it (ReleaseAssets), so every
      # published name keeps it.
      - name: Collect artifacts
        # The language packs are signed here, before the keystore is wiped.
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          find app/build/outputs/apk/en -name '*-release.apk' | while read -r apk; do
            name=$(basename "$apk" .apk)   # app-en-arm64-v8a-release
            name=${name#app-}
            name=${name%-release}
            cp "$apk" "dist/wmkeyboard-${version}-vc${code}-full-${name}.apk"
          done
          # The baseline profile, as dex metadata the installer compiles with.
          # The in-app updater stages it beside the APK, so a GitHub update is
          # compiled at install the way a Play install is, instead of running
          # interpreted until Android's overnight maintenance gets to it (11.5%
          # janky frames against 2.5% on a CPH2481). One per variant and API
          # range, named by output-metadata.json: the ABI splits of a variant
          # carry the same dex, so they share one. The standard (en) build's
          # only: nothing installs the all-languages build, which is built here
          # to cut the language packs from, and its profile next to a renamed
          # copy of the standard APK would not match it.
          for meta in app/build/outputs/apk/en/release/output-metadata.json; do
            dir=$(dirname "$meta")
            language=$(basename "$(dirname "$dir")")   # intl
            jq -r '.baselineProfiles[]? | "\(.minApi) \(.baselineProfiles[0])"' "$meta" \
              | while read -r api dm; do
                if [ -f "$dir/$dm" ]; then
                  cp "$dir/$dm" "dist/wmkeyboard-${version}-vc${code}-full-${language}-api${api}.dm"
                else
                  echo "::warning::No dex metadata at $dir/$dm"
                fi
              done
          done
          # R8 mappings, one per variant (ABI splits share one). Taken from this
          # job's build, not the bundle job's: the Play flags change what R8
          # renames, so the AAB's map does not retrace these APKs. The AAB
          # carries its own map in BUNDLE-METADATA, which Play reads by itself.
          #
          # Four now rather than two. The two language builds are separate R8
          # runs, so their maps are not interchangeable even though the Kotlin
          # that went in was identical.
          # The all-languages one too: the offline build is that variant with
          # a different manifest, and the retrace workflow uses this map for it.
          for language in intl en; do
            map="app/build/outputs/mapping/${language}Release/mapping.txt"
            if [ ! -f "$map" ]; then
              echo "::error::No R8 mapping at $map"
              exit 1
            fi
            gzip -9c "$map" \
              > "dist/wmkeyboard-${version}-vc${code}-full-${language}-mapping.txt.gz"
          done
          # Native symbols. Both language builds carry the same .so files, but
          # each variant writes its own zip and the release grid links them
          # separately.
          for lower in en; do
            syms="app/build/outputs/native-debug-symbols/${lower}Release/native-debug-symbols.zip"
            if [ -f "$syms" ]; then
              cp "$syms" "dist/wmkeyboard-${version}-vc${code}-full-${lower}-native-symbols.zip"
            else
              echo "::warning::No native debug symbols at $syms"
            fi
          done
          # The language packs, cut from the all-languages universal APK and
          # signed with the release key the app checks them against.
          intl=$(find app/build/outputs/apk/intl -name '*-universal-release.apk' | head -1)
          [ -n "$intl" ] || { echo "::error::No all-languages universal APK"; exit 1; }
          .github/scripts/language-packs.sh "$intl" dist "$version" "$code"
          # Check the standard build's pinned feature libraries against the
          # jniLibs it packaged. This fork does not publish them (upstream's
          # data repository already carries the ones its releases pin), so the
          # check is here to fail the run on a mismatch, not to produce assets.
          standard=$(find app/build/outputs/apk/en -name '*-universal-release.apk' | head -1)
          .github/scripts/collect-natives.sh "$standard" natives
          # No SHA256SUMS.txt: GitHub lists a SHA-256 digest for every release
          # asset, which is what the in-app updater checks, and the file sat at
          # the top of the asset list where nobody installing wants it.
          ls -l dist

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/
          retention-days: 30

      # The resource IDs the language packs were cut against, for the
      # `pack-ids` check: the offline English build must match them.
      - uses: actions/upload-artifact@v4
        with:
          name: resource-ids-standard
          path: build/resource-ids.txt
          retention-days: 30

  # The offline build: no INTERNET permission (#292), for people who want a
  # keyboard that cannot reach the network at all. From 0.6.4 it is as slim
  # as the standard build: English, with its feature libraries pinned rather
  # than bundled. It cannot fetch either, so both come in as imports of the
  # same files the standard build downloads: this release's lang-*.apk packs
  # (Android 11 and up) and the data repository's `natives` assets. Beside it
  # an all-languages build (universal only) for Android 7 to 10, which cannot
  # load a language pack, and for anyone who wants every language built in.
  # Both install over the standard build and back.
  #
  # Its own runner: wmkb.noInternet is a project-wide flag, so
  # it cannot share a Gradle invocation with the regular builds, and a second
  # invocation in that job would overwrite their release APKs.
  # Every other input matches the `apks` job, which keeps the dex the same as
  # the regular builds' and so lets the retrace workflow use their mappings,
  # and keeps the English build's resource IDs the ones the language packs
  # were cut against (`pack-ids` checks).
  offline:
    name: No-internet APKs
    needs: verify
    if: needs.verify.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Release builds must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # assets/supporters.json is what the app lists before its own network
      # check, and all a no-internet build ever shows. Refresh it from the live
      # /api/supporters so each release names everyone who tipped up to the
      # build, not up to the last time someone ran `npm run supporters`. Site
      # down: keep the committed copy, never fail a release over a credits list.
      # F-Droid builds from the tagged source, so its APK has the committed one.
      - name: Refresh the supporters list
        run: node docs/scripts/sync-supporters.mjs || echo "::warning::Could not reach /api/supporters; this build ships the committed supporters.json"

      - name: Build the no-internet APKs
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          WMKB_ENABLE_PLAY_STORE: 'false'
          WMKB_ENABLE_GMS: 'true'
          WMKB_SPLIT_APKS: 'true'
          WMKB_NO_INTERNET: 'true'
          WMKB_KLIPY_API_KEY: ${{ secrets.WMKB_KLIPY_API_KEY }}
          WMKB_GIPHY_API_KEY: ${{ secrets.WMKB_GIPHY_API_KEY }}
          WMKB_BRAVE_API_KEY: ${{ secrets.WMKB_BRAVE_API_KEY }}
          WMKB_TRANSLATE_API_KEY: ${{ secrets.WMKB_TRANSLATE_API_KEY }}
          WMKB_UNSPLASH_API_KEY: ${{ secrets.WMKB_UNSPLASH_API_KEY }}
          WMKB_PEXELS_API_KEY: ${{ secrets.WMKB_PEXELS_API_KEY }}
          WMKB_DROPBOX_APP_KEY: ${{ secrets.WMKB_DROPBOX_APP_KEY }}
          WMKB_ONEDRIVE_CLIENT_ID: ${{ secrets.WMKB_ONEDRIVE_CLIENT_ID }}
          WMKB_SMARTTHINGS_CLIENT_ID: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_ID }}
          WMKB_SMARTTHINGS_CLIENT_SECRET: ${{ secrets.WMKB_SMARTTHINGS_CLIENT_SECRET }}
        # One variant per Gradle call, as in `apks`.
        run: |
          ./gradlew assembleEnRelease \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace
          mkdir -p build
          cp app/build/intermediates/stable_resource_ids_file/enRelease/processEnReleaseResources/stableIds.txt \
            build/resource-ids.txt
          ./gradlew assembleIntlRelease \
            -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace

      - name: Wipe keystore
        if: always()
        run: rm -f release.keystore

      # `-nointernet-` sits between the languages part and the ABI, where
      # ReleaseAssets' anchored pattern refuses it, so the in-app updater of a
      # regular build never offers one of these (ReleaseAssetsTest holds it).
      #
      # The permission check is the point of the job: ML Kit declares INTERNET
      # in its own manifest, so the overlay failing to apply would put it back
      # without a single build error.
      - name: Collect and check
        run: |
          version=$(grep '^wmkb.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          mkdir -p dist
          # The published names keep the `full` edition token (see the apks job).
          # name:gradle flavour:ABIs. The all-languages one is universal only:
          # it is for Android 7 to 10, which runs on 32-bit phones as often.
          for variant in full-en:en:arm64-v8a,universal full-intl:intl:universal; do
            name=${variant%%:*}
            rest=${variant#*:}
            gradle=${rest%%:*}
            abis=${rest#*:}
            for abi in ${abis//,/ }; do
              apk=$(find app/build/outputs/apk -name "app-${gradle}-${abi}-release.apk" | head -1)
              if [ -z "$apk" ]; then
                echo "::error::No app-${gradle}-${abi}-release.apk under app/build/outputs/apk"
                exit 1
              fi
              perms=$("$aapt2" dump permissions "$apk")
              echo "$perms"
              if echo "$perms" | grep -q "android.permission.INTERNET'"; then
                echo "::error::$apk still declares android.permission.INTERNET"
                exit 1
              fi
              cp "$apk" "dist/wmkeyboard-${version}-vc${code}-${name}-nointernet-${abi}.apk"
            done
            map=app/build/outputs/mapping/${gradle}Release/mapping.txt
            if [ ! -f "$map" ]; then
              echo "::error::No R8 mapping at $map"
              exit 1
            fi
            gzip -9c "$map" > "dist/wmkeyboard-${version}-vc${code}-${name}-nointernet-mapping.txt.gz"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: offline-apks
          path: dist/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: resource-ids-offline
          path: build/resource-ids.txt
          retention-days: 30

  # The language packs are cut from the `apks` job's all-languages build,
  # compiled with the standard English build's resource IDs. The offline
  # English build is a separate compile on another runner, so it takes the
  # same packs only if aapt2 gave it the same IDs, which it should: only its
  # manifest differs. Checked here rather than assumed, in dry runs too,
  # because a mismatch would load every pack's strings under the wrong names.
  pack-ids:
    name: Language packs fit the offline build
    needs: [apks, offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resource-ids-standard
          path: standard
      - uses: actions/download-artifact@v4
        with:
          name: resource-ids-offline
          path: offline
      - run: |
          if ! cmp -s standard/resource-ids.txt offline/resource-ids.txt; then
            echo "::error::The offline English build's resource IDs differ from the standard build's, so this release's language packs would not fit it"
            diff standard/resource-ids.txt offline/resource-ids.txt | head -40
            exit 1
          fi
          echo "Resource IDs match ($(wc -l < standard/resource-ids.txt) resources)"

  publish:
    name: Publish GitHub release
    # `offline` for the no-internet APKs, and `pack-ids` so they never ship
    # beside language packs that do not fit. This fork publishes to GitHub
    # alone: the store jobs (`fdroid`, `bundle`, `play`) are deliberately gone,
    # so nothing here waits on one.
    needs: [verify, apks, offline, pack-ids]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes script finds the previous tag and walks the
      # commits between it and this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: offline-apks
          path: dist

      # No native delivery here: this fork does not publish the project's
      # feature libraries. The app still fetches them from upstream's
      # wasi-master/wmkeyboard-data by hash, which upstream's own releases
      # keep stocked. The `apks` job still runs collect-natives.sh, so a
      # build whose pins do not match its jniLibs fails before this point.

      # Only the manifest differs from the regular build of each, so R8 should
      # have renamed both the same way, and the retrace workflow, which reads
      # the variant off either build's crash record, uses the regular mapping.
      # Identical: drop the copy. Different: keep it, and say so, because the
      # retrace workflow will not find it by itself.
      - name: Keep the no-internet mapping only if it differs
        run: |
          shopt -s nullglob
          cd dist
          for own in *-nointernet-mapping.txt.gz; do
            regular=${own/-nointernet/}
            if [ -f "$regular" ] && cmp -s <(gunzip -c "$own") <(gunzip -c "$regular"); then
              echo "$own matches $regular; not attaching it"
              rm "$own"
            else
              echo "::warning::$own differs from $regular. Attached, but the retrace workflow will not use it for a no-internet crash."
            fi
          done

      # The body is built from the artifacts that were actually produced, so
      # the download grid carries real file sizes and never links a file the
      # build did not make.
      - name: Build release notes
        id: notes
        run: |
          code=$(grep '^wmkb.versionCode=' gradle.properties | cut -d= -f2)
          .github/scripts/release-notes.sh \
            '${{ needs.verify.outputs.version }}' \
            "$code" \
            '${{ github.ref_name }}' \
            dist \
            '${{ github.repository }}' > release-body.md
          echo "--- release body ---"
          cat release-body.md

      # Done with the gh CLI rather than softprops/action-gh-release, which
      # failed the 0.5.9 publish with "Error creating asset temp dir" and left
      # a draft carrying three of its twelve files. Uploading one file at a
      # time is slower and does not fall over.
      #
      # The release is made as a draft, filled, and only then published, so it
      # never appears to a watcher with half its APKs attached. The whole step
      # is idempotent: a re-run edits and re-uploads over whatever the last
      # attempt managed.
      #
      # `announce` is true only when this run is what makes the release
      # public: it did not exist, or it was still a draft from an attempt that
      # died before publishing. A re-run, or a tag moved onto a fixed commit
      # and rebuilt (0.6.2), updates a release people have already been told
      # about, and the Telegram step below stays quiet for it.
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: WM Keyboard ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.apk dist/*.dm dist/*-mapping.txt.gz dist/*-native-symbols.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing in dist/ to attach"
            exit 1
          fi
          if draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then announce=true; else announce=false; fi
            gh release edit "$TAG" --repo "$REPO" \
              --title "$TITLE" --notes-file release-body.md
          else
            announce=true
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "$TITLE" --notes-file release-body.md
          fi
          for f in "${files[@]}"; do
            echo "uploading $(basename "$f")"
            gh release upload "$TAG" --repo "$REPO" --clobber "$f"
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "announce=$announce" >> "$GITHUB_OUTPUT"

      # Announce the new release on the Telegram community in the
      # announcements and releases topic (#19), linking the standard English
      # arm64 APK (telegram_release.py says what it attaches).
      # Once per release: not when this run only updated a published one.
      - name: Announce on Telegram
        if: steps.release.outputs.announce == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::warning::TELEGRAM_TOKEN is not set; skipping Telegram announcement"
            exit 0
          fi
          python3 .github/scripts/telegram_release.py \
            --tag "$TAG" \
            --repo "$REPO" \
            --version "$VERSION" \
            --notes-file release-body.md \
            --dist dist

  # Comments on every issue the release notes link, now that there is a
  # release to point at. A call rather than a `release: published` trigger in
  # that workflow, because the release above is published with this run's
  # token, and GitHub starts no workflow for an event that token caused.
  issue-comments:
    name: Tell the linked issues
    needs: [verify, publish]
    if: github.ref_type == 'tag' && !inputs.dry_run
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/release-comments.yml
    with:
      tag: ${{ github.ref_name }}
      # GitHub is the only channel this fork publishes to, so the comment
      # names no store and says nothing about waiting for one.
      stores: ''

  # Points the bug report form at the version just published, so reporters
  # are asked to confirm they are on it. Runs after publish, so a failed or
  # dry run never advertises a version nobody can download. Commits to main,
  # not the tag: a tag can be cut from an older commit and the form must
  # follow main.
  issue-template:
    name: Bump bug report version
    needs: [verify, publish]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rewrite and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          file=.github/ISSUE_TEMPLATE/bug_report.yml
          old=$(sed -n 's/^# latest-version: //p' "$file")
          if [ -z "$old" ]; then
            echo "::error::$file has no '# latest-version:' line"
            exit 1
          fi
          if [ "$old" = "$VERSION" ]; then
            echo "Bug report already names $VERSION"
            exit 0
          fi
          # Dots escaped so 0.5.9 does not also match 0x5y9.
          pattern=$(printf '%s' "$old" | sed 's/\./\\./g')
          sed -i "s/$pattern/$VERSION/g" "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m "chore(issues): bug report asks for $VERSION"
          # main may move while the release builds; rebase and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push the bug report bump to main"
          exit 1
